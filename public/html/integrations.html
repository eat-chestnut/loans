<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>三方配置 - 小贷管理后台 Demo</title>
<link rel="stylesheet" href="assets/app.css"/>
</head>
<body>
<header>
  <h1>小贷管理后台 Demo</h1>
  <span class="pill">三方配置</span>
</header>
<div class="layout">
  <aside>
    <div class="brand">导航</div>
    <nav>
      <a href="dashboard.html">🏠 首页</a>
      <a href="reports.html">📊 报表中心</a>
      <a href="employees.html">👤 员工管理</a>
      <a href="customers.html">👥 客户管理</a>
      <a href="loans.html">💳 放款管理</a>
      <a href="repayments.html">💸 还款管理</a>
      <a href="overdue.html">⏰ 逾期管理</a>
      <a href="integrations.html" class="active">🔌 三方配置</a>
      <a href="settings.html">⚙️ 系统配置</a>
      <a href="autopay-logs.html">🏦 扣款记录</a>
      <a href="sms-logs.html">✉️ 短信记录</a>
      <a href="wecom-logs.html">💬 企微通知</a>
      <a href="notifications.html">🔔 通知中心</a>
      <a href="wecom.html">🤝 企微客户库</a>
    </nav>
  </aside>
  <main>
    <section id="integrations">
      <div class="grid cols-3">
        <div class="form">
          <h3>企业微信 · 客户管理</h3>
          <div class="grid"><div><label>CorpID</label><input id="wx_corpid" class="input"></div>
            <div><label>Secret</label><input id="wx_secret" class="input"></div>
            <div><label>AgentId</label><input id="wx_agent" class="input"></div></div>
          <div style="margin-top:10px" class="row">
            <button class="btn ok" onclick="saveConfig('wecom')">保存</button>
            <button class="btn" onclick="testWeCom()">模拟同步客户</button>
          </div>
        </div>
        <div class="form">
          <h3>短信网关</h3>
          <div class="grid">
            <div><label>服务商</label><select id="sms_vendor" class="select"><option>Aliyun</option><option>TencentSMS</option><option>Submail</option></select></div>
            <div><label>Access Key</label><input id="sms_key" class="input"></div>
            <div><label>Access Secret</label><input id="sms_secret" class="input"></div>
            <div><label>签名</label><input id="sms_sign" class="input"></div>
            <div><label>模板ID</label><input id="sms_tpl" class="input"></div>
          </div>
          <div style="margin-top:10px" class="row">
            <button class="btn ok" onclick="saveConfig('sms')">保存</button>
            <button class="btn" onclick="mockSendOne()">模拟发送短信</button>
          </div>
        </div>
        <div class="form">
          <h3>三方代扣 / 支付通道</h3>
          <div class="grid">
            <div><label>通道</label><select id="ap_channel" class="select"><option>UnionPay</option><option>BestPay</option><option>MockPay</option></select></div>
            <div><label>商户号</label><input id="ap_merchant" class="input"></div>
            <div><label>AppKey</label><input id="ap_key" class="input"></div>
            <div><label>回调地址</label><input id="ap_notify" class="input" placeholder="https://example.com/callback"></div>
          </div>
          <div style="margin-top:10px" class="row">
            <button class="btn ok" onclick="saveConfig('autopay')">保存</button>
            <button class="btn" onclick="mockDeduct()">模拟代扣</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<dialog id="dlg"><div class="d-hd" id="dlg_title">对话框</div>
  <form method="dialog" class="d-bd" id="dlg_body"></form>
  <div class="d-ft"><button type="button" class="btn" onclick="closeDlg()">取消</button><button id="dlg_ok" class="btn ok">确定</button></div>
</dialog>
<script src="assets/app.js"></script>
</body>
</html>
