<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>放款管理 - 小贷管理后台 Demo</title>
<link rel="stylesheet" href="assets/app.css"/>
</head>
<body>
<header>
  <h1>小贷管理后台 Demo</h1>
  <span class="pill">放款管理</span>
</header>
<div class="layout">
  <aside>
    <div class="brand">导航</div>
    <nav>
      <a href="dashboard.html">🏠 首页</a>
      <a href="reports.html">📊 报表中心</a>
      <a href="employees.html">👤 员工管理</a>
      <a href="customers.html">👥 客户管理</a>
      <a href="loans.html" class="active">💳 放款管理</a>
      <a href="repayments.html">💸 还款管理</a>
      <a href="overdue.html">⏰ 逾期管理</a>
      <a href="integrations.html">🔌 三方配置</a>
      <a href="settings.html">⚙️ 系统配置</a>
      <a href="autopay-logs.html">🏦 扣款记录</a>
      <a href="sms-logs.html">✉️ 短信记录</a>
      <a href="wecom-logs.html">💬 企微通知</a>
      <a href="notifications.html">🔔 通知中心</a>
      <a href="wecom.html">🤝 企微客户库</a>
    </nav>
  </aside>
  <main>
    <section id="loans" class="section-card">
      <div class="section-header">
        <h3>放款管理</h3>
        <span class="pill">状态分栏 · 模块化审批</span>
      </div>
      <p class="section-desc">支持按照状态分组查看，快速定位逾期或新增案件，并可直接新建放款。</p>
      <div class="toolbar" style="flex-wrap:wrap;">
        <input id="l_q" class="input" placeholder="搜索客户 / 当票号…"/>
        <input id="l_min" class="input" type="number" placeholder="金额≥"/>
        <input id="l_max" class="input" type="number" placeholder="金额≤"/>
        <button class="btn primary" onclick="openLoanModal()">+ 新建放款</button>
        <div class="right"><button class="btn" onclick="downloadCSV('loans')">导出CSV</button></div>
      </div>
      <div id="loan_tabs" class="tabs"></div>
      <div id="l_table"></div>
      <div id="l_page"></div>
    </section>
  </main>
</div>
<dialog id="dlg"><div class="d-hd" id="dlg_title">对话框</div>
  <form method="dialog" class="d-bd" id="dlg_body"></form>
  <div class="d-ft"><button type="button" class="btn" onclick="closeDlg()">取消</button><button id="dlg_ok" class="btn ok">确定</button></div>
</dialog>
<script src="assets/app.js?v=1"></script>
</body>
</html>
