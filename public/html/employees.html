<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>员工管理 - 小贷管理后台 Demo</title>
<link rel="stylesheet" href="assets/app.css"/>
</head>
<body>
<header>
  <h1>小贷管理后台 Demo</h1>
  <span class="pill">员工管理</span>
</header>
<div class="layout">
  <aside>
    <div class="brand">导航</div>
    <nav>
      <a href="dashboard.html">🏠 首页</a>
      <a href="reports.html">📊 报表中心</a>
      <a href="employees.html" class="active">👤 员工管理</a>
      <a href="customers.html">👥 客户管理</a>
      <a href="loans.html">💳 放款管理</a>
      <a href="repayments.html">💸 还款管理</a>
      <a href="overdue.html">⏰ 逾期管理</a>
      <a href="integrations.html">🔌 三方配置</a>
      <a href="settings.html">⚙️ 系统配置</a>
      <a href="autopay-logs.html">🏦 扣款记录</a>
      <a href="sms-logs.html">✉️ 短信记录</a>
      <a href="wecom-logs.html">💬 企微通知</a>
      <a href="notifications.html">🔔 通知中心</a>
      <a href="wecom.html">🤝 企微客户库</a>
    </nav>
  </aside>
  <main>
    <section id="employees" class="section-card">
      <div class="section-header">
        <h3>员工列表</h3>
        <span class="pill">编制 / 状态管理</span>
      </div>
      <p class="section-desc">实时掌握客户经理与风控团队配置，可快速导出或新增人员。</p>
      <div class="toolbar">
        <input id="e_q" class="input" placeholder="搜索姓名 / 手机 / 角色…"/>
        <button class="btn primary" onclick="openEmployeeModal()">+ 新增员工</button>
        <div class="right"><button class="btn" onclick="downloadCSV('employees')">导出CSV</button><button class="btn" onclick="resetDemo()">恢复演示数据</button></div>
      </div>
      <div id="e_table"></div>
      <div id="e_page"></div>
    </section>
  </main>
</div>
<dialog id="dlg"><div class="d-hd" id="dlg_title">对话框</div>
  <form method="dialog" class="d-bd" id="dlg_body"></form>
  <div class="d-ft"><button type="button" class="btn" onclick="closeDlg()">取消</button><button id="dlg_ok" class="btn ok">确定</button></div>
</dialog>
<script src="assets/app.js"></script>
</body>
</html>
