<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等额本息还款计算器</title>
    <script src="vendor/xlsx.full.min.js"></script>
    <script src="vendor/docx.umd.js"></script>
    <script src="vendor/jszip.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #3498db, #2c3e50);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .input-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #eaeaea;
        }
        
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .input-item {
            flex: 1;
            min-width: 250px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: #3498db;
            outline: none;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(90deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        button.secondary {
            background: linear-gradient(90deg, #7f8c8d, #95a5a6);
        }
        
        button.success {
            background: linear-gradient(90deg, #27ae60, #2ecc71);
        }
        
        .summary-section {
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            background: #fff;
        }
        
        .summary-card {
            background: linear-gradient(135deg, #f6f9fc 0%, #eef2f7 100%);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        
        .summary-card h3 {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        
        .summary-card p {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .table-section {
            padding: 20px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        
        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eaeaea;
        }
        
        th {
            background: linear-gradient(90deg, #3498db, #2980b9);
            color: white;
            font-weight: 600;
        }
        
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        tr:hover {
            background-color: #eef5ff;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
            background: #f8f9fa;
            border-top: 1px solid #eaeaea;
        }
        
        @media (max-width: 768px) {
            .input-item {
                min-width: 100%;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
                justify-content: center;
            }
            
            .summary-section {
                grid-template-columns: 1fr;
            }
        }
        
        .icon {
            font-size: 18px;
        }

        .download-modal {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 2000;
            transition: opacity 0.2s ease;
        }

        .download-modal:not(.is-active) {
            opacity: 0;
        }

        .download-modal.is-active {
            opacity: 1;
        }

        .download-modal__overlay {
            position: absolute;
            inset: 0;
            background: rgba(44, 62, 80, 0.45);
        }

        .download-modal__dialog {
            position: relative;
            background: #fff;
            border-radius: 12px;
            width: min(660px, 100%);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
            transform: translateY(30px);
            opacity: 0;
            transition: transform 0.24s ease, opacity 0.24s ease;
        }

        .download-modal.is-active .download-modal__dialog {
            transform: translateY(0);
            opacity: 1;
        }

        .download-modal__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            border-bottom: 1px solid #e5e9f2;
        }

        .download-modal__header h3 {
            font-size: 1.2rem;
            color: #2c3e50;
        }

        .download-modal__close {
            background: transparent;
            border: none;
            font-size: 26px;
            color: #95a5a6;
            cursor: pointer;
            line-height: 1;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .download-modal__close:hover {
            background: rgba(149, 165, 166, 0.12);
        }

        .download-modal__body {
            padding: 20px 28px;
            overflow-y: auto;
        }

        .download-modal__section + .download-modal__section {
            margin-top: 24px;
        }

        .download-modal__section h4 {
            font-size: 1rem;
            color: #34495e;
            margin-bottom: 12px;
        }

        .download-modal__form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        @media (min-width: 1024px) {
            .download-modal__form-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .download-modal__field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
            color: #2c3e50;
        }

        .download-modal__field input,
        .download-modal__field select {
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .download-modal__field input:focus,
        .download-modal__field select:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
            outline: none;
        }

        .download-modal__file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-modal__file-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 16px;
            border: 1px solid #e5e9f2;
            border-radius: 10px;
            background: linear-gradient(135deg, #fdfdfd 0%, #f7f9fc 100%);
        }

        .download-modal__file-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
        }

        .download-modal__file-checkbox input {
            width: 18px;
            height: 18px;
        }

        .download-modal__copies {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #2c3e50;
        }

        .download-modal__copies-input {
            width: 72px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #d0d7de;
            text-align: right;
            font-size: 14px;
        }

        .download-modal__footer {
            padding: 18px 28px;
            border-top: 1px solid #e5e9f2;
            display: flex;
            justify-content: flex-end;
        }

        .download-modal__confirm {
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            color: #fff;
            border: none;
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .download-modal__confirm:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(39, 174, 96, 0.35);
        }

        @media (max-width: 640px) {
            .download-modal {
                padding: 16px;
            }

            .download-modal__dialog {
                width: 100%;
            }

            .download-modal__form-grid {
                grid-template-columns: 1fr;
            }

            .download-modal__body {
                padding: 16px 20px;
            }

            .download-modal__header,
            .download-modal__footer {
                padding: 16px 20px;
            }

            .download-modal__file-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .download-modal__copies {
                align-self: stretch;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>等额本息还款计算器</h1>
            <p class="subtitle">根据贷款金额、年数和总利息计算每月还款计划</p>
        </header>
        
        <div class="input-section">
            <div class="input-group">
                <div class="input-item">
                    <label for="loan-date">借款日期</label>
                    <input type="date" id="loan-date" value="">
                </div>
                <div class="input-item">
                    <label for="loan-amount">贷款金额（元）</label>
                    <input type="number" id="loan-amount" value="600000" min="0">
                </div>
                <div class="input-item">
                    <label for="loan-month">贷款月数</label>
                    <input type="number" id="loan-month" value="60" min="1" max="500">
                </div>
                <div class="input-item">
                    <label for="total-interest">贷款总利息（元）</label>
                    <input type="number" id="total-interest" value="396000" min="0">
                </div>
            </div>
            
            <div class="button-group">
                <button id="calculate-btn">
                    <span class="icon">📊</span> 计算还款计划
                </button>
                <button id="reset-btn" class="secondary">
                    <span class="icon">🔄</span> 重置输入
                </button>
                <button id="download-btn" class="success">
                    <span class="icon">💾</span> 下载合同
                </button>
            </div>
        </div>
        
        <div class="summary-section">
            <div class="summary-card">
                <h3>每月还款额</h3>
                <p id="monthly-payment">0 元</p>
            </div>
            <div class="summary-card">
                <h3>还款总额</h3>
                <p id="total-payment">0 元</p>
            </div>
            <div class="summary-card" id="interest-card">
                <h3>总利息</h3>
                <p id="actual-interest">0 元</p>
            </div>
            <div class="summary-card" id="rate-card" style="display:none;">
                <h3>年利率</h3>
                <p id="annual-rate">0%</p>
            </div>
        </div>
        
        <div class="table-section">
            <h2>还款计划表</h2>
            <div id="repayment-plan">
                <table id="repayment-table">
                    <thead>
                        <tr>
                            <th>期数</th>
                            <th>还款日期</th>
                            <th>月还款额</th>
                            <th>本金</th>
                            <th>利息</th>
                            <th>剩余本金</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 还款计划将通过JavaScript动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2025 等额本息还款计算器 | 计算结果仅供参考，实际贷款条件以银行规定为准</p>
        </div>
    </div>
    <script src="js/utils.js" defer></script>
    <script src="js/calculator.js?v=455" defer></script>
    <script src="js/contract.js?v=455" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
