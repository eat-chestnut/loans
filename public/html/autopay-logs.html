<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>三方扣款记录 - 小贷管理后台 Demo</title>
<link rel="stylesheet" href="assets/app.css"/>
</head>
<body>
<header>
  <h1>小贷管理后台 Demo</h1>
  <span class="pill">三方扣款记录</span>
</header>
<div class="layout">
  <aside>
    <div class="brand">导航</div>
    <nav>
      <a href="dashboard.html">🏠 首页</a>
      <a href="reports.html">📊 报表中心</a>
      <a href="employees.html">👤 员工管理</a>
      <a href="customers.html">👥 客户管理</a>
      <a href="loans.html">💳 放款管理</a>
      <a href="repayments.html">💸 还款管理</a>
      <a href="overdue.html">⏰ 逾期管理</a>
      <a href="integrations.html">🔌 三方配置</a>
      <a href="settings.html">⚙️ 系统配置</a>
      <a href="autopay-logs.html" class="active">🏦 扣款记录</a>
      <a href="sms-logs.html">✉️ 短信记录</a>
      <a href="wecom-logs.html">💬 企微通知</a>
      <a href="notifications.html">🔔 通知中心</a>
      <a href="wecom.html">🤝 企微客户库</a>
    </nav>
  </aside>
  <main>
    <section id="autopay" class="section-card">
      <div class="section-header">
        <h3>代扣执行记录</h3>
        <span class="pill">包含成功 / 重试 / 失败等状态</span>
      </div>
      <p class="section-desc">实时追踪三方代扣批次、通道与结果，可按状态快速筛选排障。</p>
      <div class="toolbar">
        <input id="autopay_q" class="input" placeholder="搜索客户 / 贷款号 / 说明"/>
        <select id="autopay_status" class="select">
          <option value="all">全部状态</option>
          <option value="成功">成功</option>
          <option value="重试">重试</option>
          <option value="失败">失败</option>
        </select>
      </div>
      <div id="autopay_table"></div>
      <div id="autopay_page"></div>
    </section>
  </main>
</div>
<dialog id="dlg"><div class="d-hd" id="dlg_title">对话框</div>
  <form method="dialog" class="d-bd" id="dlg_body"></form>
  <div class="d-ft"><button type="button" class="btn" onclick="closeDlg()">取消</button><button id="dlg_ok" class="btn ok">确定</button></div>
</dialog>
<script src="assets/app.js"></script>
</body>
</html>
