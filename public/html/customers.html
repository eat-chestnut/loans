<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>客户管理 - 小贷管理后台 Demo</title>
<link rel="stylesheet" href="assets/app.css"/>
</head>
<body>
<header>
  <h1>小贷管理后台 Demo</h1>
  <span class="pill">客户管理</span>
</header>
<div class="layout">
  <aside>
    <div class="brand">导航</div>
    <nav>
      <a href="dashboard.html">🏠 首页</a>
      <a href="reports.html">📊 报表中心</a>
      <a href="employees.html">👤 员工管理</a>
      <a href="customers.html" class="active">👥 客户管理</a>
      <a href="loans.html">💳 放款管理</a>
      <a href="repayments.html">💸 还款管理</a>
      <a href="overdue.html">⏰ 逾期管理</a>
      <a href="integrations.html">🔌 三方配置</a>
      <a href="settings.html">⚙️ 系统配置</a>
      <a href="autopay-logs.html">🏦 扣款记录</a>
      <a href="sms-logs.html">✉️ 短信记录</a>
      <a href="wecom-logs.html">💬 企微通知</a>
      <a href="notifications.html">🔔 通知中心</a>
      <a href="wecom.html">🤝 企微客户库</a>
    </nav>
  </aside>
  <main>
    <section id="customers" class="section-card">
      <div class="section-header">
        <h3>客户管理</h3>
        <span class="pill">信用 / 绑定 / 档案</span>
      </div>
      <p class="section-desc">支持风险分层筛选、企微绑定以及导出档案，方便客户经理快速掌握在贷情况。</p>
      <div class="toolbar">
        <input id="c_q" class="input" placeholder="搜索姓名 / 身份证 / 电话 / 归宿地…"/>
        <select id="c_risk" class="select">
          <option value="all">全部风险</option>
          <option value="低风险">低风险</option>
          <option value="中风险">中风险</option>
          <option value="高风险">高风险</option>
          <option value="极高风险">极高风险</option>
        </select>
        <button class="btn primary" onclick="openCustomerModal()">+ 新增客户</button>
        <div class="right"><button class="btn" onclick="downloadCSV('customers')">导出CSV</button></div>
      </div>
      <div id="c_table"></div>
      <div id="c_page"></div>
    </section>
  </main>
</div>
<dialog id="dlg"><div class="d-hd" id="dlg_title">对话框</div>
  <form method="dialog" class="d-bd" id="dlg_body"></form>
  <div class="d-ft"><button type="button" class="btn" onclick="closeDlg()">取消</button><button id="dlg_ok" class="btn ok">确定</button></div>
</dialog>
<script src="assets/app.js"></script>
</body>
</html>
