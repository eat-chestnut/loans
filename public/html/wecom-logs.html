<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>企微通知记录 - 小贷管理后台 Demo</title>
<link rel="stylesheet" href="assets/app.css"/>
</head>
<body>
<header>
  <h1>小贷管理后台 Demo</h1>
  <span class="pill">企微通知记录</span>
</header>
<div class="layout">
  <aside>
    <div class="brand">导航</div>
    <nav>
      <a href="dashboard.html">🏠 首页</a>
      <a href="reports.html">📊 报表中心</a>
      <a href="employees.html">👤 员工管理</a>
      <a href="customers.html">👥 客户管理</a>
      <a href="loans.html">💳 放款管理</a>
      <a href="repayments.html">💸 还款管理</a>
      <a href="overdue.html">⏰ 逾期管理</a>
      <a href="integrations.html">🔌 三方配置</a>
      <a href="settings.html">⚙️ 系统配置</a>
      <a href="autopay-logs.html">🏦 扣款记录</a>
      <a href="sms-logs.html">✉️ 短信记录</a>
      <a href="wecom-logs.html" class="active">💬 企微通知</a>
      <a href="wecom.html">🤝 企微客户库</a>
    </nav>
  </aside>
  <main>
    <section id="wecom-log" class="section-card">
      <div class="section-header">
        <h3>企微发送记录</h3>
        <span class="pill">来自企微提醒的模拟日志</span>
      </div>
      <p class="section-desc">展示每条企微触达的客户、联系人及文案内容，便于配合短信、电话形成闭环。</p>
      <div class="toolbar">
        <input id="wecom_log_q" class="input" placeholder="搜索客户 / 企微 / 贷款号"/>
      </div>
      <div id="wecom_logs"></div>
      <div id="wecom_log_page"></div>
    </section>
  </main>
</div>
<dialog id="dlg"><div class="d-hd" id="dlg_title">对话框</div>
  <form method="dialog" class="d-bd" id="dlg_body"></form>
  <div class="d-ft"><button type="button" class="btn" onclick="closeDlg()">取消</button><button id="dlg_ok" class="btn ok">确定</button></div>
</dialog>
<script src="assets/app.js"></script>
</body>
</html>
