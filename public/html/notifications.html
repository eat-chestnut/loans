<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>通知中心 - 小贷管理后台 Demo</title>
<link rel="stylesheet" href="assets/app.css"/>
</head>
<body>
<header>
  <h1>小贷管理后台 Demo</h1>
  <span class="pill">通知中心</span>
</header>
<div class="layout">
  <aside>
    <div class="brand">导航</div>
    <nav>
      <a href="dashboard.html">🏠 首页</a>
      <a href="reports.html">📊 报表中心</a>
      <a href="employees.html">👤 员工管理</a>
      <a href="customers.html">👥 客户管理</a>
      <a href="loans.html">💳 放款管理</a>
      <a href="repayments.html">💸 还款管理</a>
      <a href="overdue.html">⏰ 逾期管理</a>
      <a href="integrations.html">🔌 三方配置</a>
      <a href="settings.html">⚙️ 系统配置</a>
      <a href="autopay-logs.html">🏦 扣款记录</a>
      <a href="sms-logs.html">✉️ 短信记录</a>
      <a href="wecom-logs.html">💬 企微通知</a>
      <a href="notifications.html" class="active">🔔 通知中心</a>
      <a href="wecom.html">🤝 企微客户库</a>
    </nav>
  </aside>
  <main>
    <section id="notify">
      <div class="cards">
        <div class="card"><h3>任务总数</h3><div class="metric" id="notify_total">-</div><div class="help">所有通知任务</div></div>
        <div class="card"><h3>运行中</h3><div class="metric" id="notify_running">-</div><div class="help">当前执行中的批次</div></div>
        <div class="card"><h3>成功率</h3><div class="metric" id="notify_success">-</div><div class="help">累计成功 / 已发送</div></div>
        <div class="card"><h3>今日排程</h3><div class="metric" id="notify_today">-</div><div class="help">今天计划执行任务</div></div>
      </div>
      <div class="toolbar">
        <select id="notify_channel" class="select">
          <option value="all">全部渠道</option>
          <option value="短信">短信</option>
          <option value="企微">企微</option>
          <option value="电话">电话</option>
          <option value="APP Push">APP Push</option>
        </select>
        <select id="notify_status" class="select">
          <option value="all">全部状态</option>
          <option value="排队">排队</option>
          <option value="进行中">进行中</option>
          <option value="暂停">暂停</option>
          <option value="完成">完成</option>
          <option value="失败">失败</option>
        </select>
        <input id="notify_q" class="input" placeholder="搜索任务 / 负责人"/>
        <button class="btn primary" onclick="openNotificationModal()">+ 新建任务</button>
        <button class="btn" onclick="simulateNotificationRun()">模拟执行</button>
        <button class="btn" onclick="downloadNotificationsCSV()">导出CSV</button>
      </div>
      <div id="notify_table"></div>
      <div id="notify_pager"></div>
      <div class="grid cols-2" style="margin-top:16px">
        <div class="card">
          <h3>任务排程</h3>
          <div id="notify_schedule" class="schedule-panel">加载中...</div>
        </div>
        <div class="card">
          <h3>失败/重试监控</h3>
          <div id="notify_retry" class="schedule-panel">加载中...</div>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="toolbar">
          <strong>模板库</strong>
          <input id="tpl_search" class="input" placeholder="搜索模板"/>
          <div class="right"><button class="btn" onclick="downloadTemplatesCSV()">导出模板</button><button class="btn primary" onclick="openTemplateModal()">+ 新增模板</button></div>
        </div>
        <div id="tpl_table"></div>
        <div id="tpl_pager"></div>
      </div>
    </section>
  </main>
</div>
<dialog id="dlg"><div class="d-hd" id="dlg_title">对话框</div>
  <form method="dialog" class="d-bd" id="dlg_body"></form>
  <div class="d-ft"><button type="button" class="btn" onclick="closeDlg()">取消</button><button id="dlg_ok" class="btn ok">确定</button></div>
</dialog>
<script src="assets/app.js"></script>
</body>
</html>
